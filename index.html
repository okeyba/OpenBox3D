<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>苏哇工作台 · OpenBox3D</title>
  <link rel="icon" type="image/png" href="./brand/logo-static.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    html { -webkit-font-smoothing: antialiased; }
    body { margin: 0; font-family: "Noto Sans SC", sans-serif; color: #211d18; overflow: hidden; }
    input:focus, select:focus { outline: 2px solid rgba(154,91,31,.45); outline-offset: 0; }
    button { font-family: inherit; }
    /* 苏哇猫 logo 尾摆动效 */
    .logo-tail { transform-box: view-box; transform-origin: 46px 44px; animation: logoWag 2.4s ease-in-out infinite; }
    @keyframes logoWag { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-16deg); } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
