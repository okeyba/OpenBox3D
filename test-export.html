<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>export test</title></head>
<body>
<pre id="out">running…</pre>
<script type="module">
// 测试导出：拦截 Blob 下载，校验文件内容
import { geomOf } from '/src/dieline/geom.js';
import { exportPDF, pdfByteLength, pdfTextStream } from '/src/export/pdf.js';
import { exportSeparations } from '/src/export/separations.js';

const results = [], downloads = [];
const origCreate = URL.createObjectURL;
URL.createObjectURL = blob => {
  results.push({ size: blob.size, type: blob.type, blob });
  return 'blob:fake';
};
document.createElement = ((orig) => function (tag) {
  const el = orig.call(document, tag);
  if (tag === 'a') el.click = () => { downloads.push(el.download); };
  return el;
})(document.createElement.bind(document));

const s = {
  tpl: 'rte', L: 80, W: 40, H: 120, bleed: 3, glue: 14, ovr: {}, typeOvr: {},
  embDir: 'up', embDepth: 0.3,
  layers: [
    { id: 1, kind: 'shape', panelId: 'front', x: 58, y: 32, w: 28, h: 20, content: '四色底图', color: '#9a5b1f', finish: 'none', visible: true },
    { id: 2, kind: 'text', panelId: 'front', x: 80.7, y: 48, content: '匠心茶礼', font: 'Noto Serif SC', size: 11, weight: 700, color: '#211d18', finish: 'foil', visible: true },
    { id: 4, kind: 'shape', panelId: 'front', x: 68.7, y: 106, w: 24, h: 1.4, content: '色带', color: '#9a5b1f', finish: 'uv', visible: true },
    { id: 5, kind: 'shape', panelId: 'front', x: 55, y: 35, w: 35, h: 30, content: '击凸', finish: 'emboss', embDir: 'up', visible: true },
    { id: 6, kind: 'shape', panelId: 'front', x: 75, y: 45, w: 35, h: 30, content: '击凹顶层', finish: 'emboss', embDir: 'down', visible: true },
    { id: 7, kind: 'shape', panelId: 'front', x: 62, y: 76, w: 20, h: 8, content: '亮面', finish: 'gloss', visible: true }
  ]
};
const mat = { id: 'sbs350', name: '白卡 350g', t: 0.45, bleed: 3, note: '折叠纸盒' };

const out = [];
try {
  await exportPDF(s, mat, 'cmyk');
  await exportPDF(s, mat, 'professional');
  await exportPDF(s, mat, 'rgb');
  await exportSeparations(s, mat);
  out.push('downloads: ' + downloads.join(', '));
  out.push('dual emboss plates: ' + (downloads.some(x => x.includes('emboss-up')) && downloads.some(x => x.includes('emboss-down'))));
  out.push('gloss plate: ' + downloads.some(x => x.includes('gloss_plate')));
  out.push('professional filename: ' + downloads.some(x => x.includes('_professional_print.pdf')));
  const unicodeStream = pdfTextStream('A·B'), declared = +unicodeStream.match(/\/Length (\d+)/)[1];
  out.push('UTF-8 stream length: ' + (declared === pdfByteLength('A·B')) + ' (' + declared + ' bytes)');
  for (let i = 0; i < results.length; i++) {
    const r = results[i];
    const head = new TextDecoder().decode((await r.blob.slice(0, 16).arrayBuffer()));
    const txt = new TextDecoder('latin1').decode(new Uint8Array(await r.blob.arrayBuffer()));
    const start = +(txt.match(/startxref\n(\d+)/) || [])[1], isProfessional = downloads[i].includes('_professional_'), isPlate = downloads[i].includes('_plate.pdf');
    out.push('--- ' + downloads[i] + ' size=' + r.size + ' head=' + JSON.stringify(head));
    out.push('  xref: ' + (Number.isFinite(start) && txt.slice(start, start + 4) === 'xref') + '  TrimBox: ' + /\/TrimBox \[([^\]]+)\]/.test(txt) + '  BleedBox: ' + /\/BleedBox/.test(txt) + '  CropBox: ' + /\/CropBox/.test(txt));
    out.push('  CutContour: ' + txt.includes('/CutContour') + '  Crease-sep: ' + txt.includes('/Crease') + '  OverprintMode1: ' + txt.includes('/OPM 1') + '  SCN: ' + txt.includes(' SCN'));
    out.push('  DeviceCMYK: ' + txt.includes('/DeviceCMYK') + '  DeviceRGB: ' + txt.includes('/DeviceRGB') + '  DeviceGray: ' + txt.includes('/DeviceGray') + '  Flate: ' + txt.includes('/FlateDecode') + '  JPEG: ' + txt.includes('/DCTDecode'));
    if (isProfessional) out.push('  metadata: ' + txt.includes('/Metadata 8 0 R') + '  no visible guide text: ' + !txt.includes('RED = CUT') + '  no false PDF/X claim: ' + !txt.includes('GTS_PDFXVersion'));
    if (isPlate) out.push('  lossless gray plate: ' + (txt.includes('/DeviceGray') && txt.includes('/FlateDecode') && !txt.includes('/DCTDecode')));
  }
} catch (e) { out.push('ERROR: ' + (e && e.stack || e)); }
document.getElementById('out').textContent = out.join('\n');
</script>
</body>
</html>
